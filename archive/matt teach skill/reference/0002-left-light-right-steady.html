    <title>行楷速查：左轻右稳</title>

  <body>
    <main class="page">
      <article class="lesson">
        <div class="eyebrow">Reference 0002</div>
        <h1>左轻右稳</h1>
        <section>
          <h2>一句话</h2>
          <p>左边别僵，右边别飘。</p>
        </section>
        <section>
          <h2>用在“和”字</h2>
          <ol>
            <li>“禾”小一点，轻一点，少停顿。</li>
            <li>“口”慢一点，方一点，稳一点。</li>
            <li>合起来看，左边让路，右边站住。</li>
          </ol>
        </section>
        <section>
          <h2>不要这样练</h2>
          <p>不要为了像行楷，就把所有笔画都连起来。初学行楷最重要的是可控，不是潦草。</p>
        </section>
      </article>
    </main>
  </body>
