<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>行楷观察速查：重心、收放、连贯</title>
    <link rel="stylesheet" href="../assets/course.css" />
  </head>
  <body>
    <main class="page">
      <article class="lesson">
        <div class="eyebrow">Reference 0001</div>
        <h1>行楷观察速查</h1>
        <section>
          <h2>三步观察</h2>
          <ol>
            <li><strong>重心</strong>：字有没有站稳，左右上下有没有偏倒。</li>
            <li><strong>收放</strong>：哪一部分收紧，哪一部分展开。</li>
            <li><strong>连贯</strong>：哪些笔画顺势带过，哪些笔画必须停住。</li>
          </ol>
        </section>
        <section>
          <h2>一句原则</h2>
          <p>行楷不是把楷书写快，而是在保留骨架的前提下，让笔势更连贯。</p>
        </section>
      </article>
    </main>
  </body>
</html>
